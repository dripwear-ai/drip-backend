# Separate, task-scoped PostgreSQL 17 harness. No persistent Docker volume is mounted.
services:
  postgres-pg17:
    image: postgres:17.12-alpine3.24@sha256:34261f594522cf41dfcb76aefd42b9d201098b0e6b23c9c68733f169e4218b6f
    environment:
      POSTGRES_USER: "${DRIP_PG17_TEST_USER:?temporary test user required}"
      POSTGRES_PASSWORD: "${DRIP_PG17_TEST_PASSWORD:?temporary test password required}"
      POSTGRES_DB: drip_pg17_admin
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:55436:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d drip_pg17_admin",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
