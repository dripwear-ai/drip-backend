# Dedicated, disposable Gate B test services. No existing development volumes are used.
services:
  postgres-test:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: drip_test
      POSTGRES_PASSWORD: disposable_test_only
      POSTGRES_DB: drip_gate_b_test
      PGDATA: /var/lib/postgresql/data
    ports:
      - "127.0.0.1:55435:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drip_test -d drip_gate_b_test"]
      interval: 2s
      timeout: 5s
      retries: 30
  redis-test:
    image: redis:8.2.10-alpine
    ports:
      - "127.0.0.1:56381:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
